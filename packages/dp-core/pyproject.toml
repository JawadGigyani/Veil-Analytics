[project]
name = "veil-dp-core"
version = "0.1.0"
description = "Differential privacy mechanisms, sensitivity analysis, and budget accounting for Veil Analytics."
requires-python = ">=3.12"
dependencies = [
  # scipy supplies the normal quantile used by gaussian_confidence_radius.
  # Everything else is stdlib: mechanisms sample through `secrets` so the
  # noise is not drawn from a seedable PRNG.
  "scipy>=1.14,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "hypothesis>=6.100,<7",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dp_core*"]

[tool.pytest.ini_options]
pythonpath = ["."]

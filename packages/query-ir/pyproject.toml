[project]
name = "veil-query-ir"
version = "0.1.0"
description = "Typed query intermediate representation, validation, and safe DuckDB compilation for Veil Analytics."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "hypothesis>=6.100,<7",
  "duckdb>=1.2,<2",
  "pyarrow>=19,<20",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["query_ir*"]

[tool.pytest.ini_options]
pythonpath = ["."]

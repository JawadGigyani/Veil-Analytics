[project]
name = "veil-analytics-worker"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "duckdb>=1.2,<2",
  "pyarrow>=19,<20",
  "cryptography>=44,<45",
  "python-multipart>=0.0.20,<1",
  "pydantic-settings>=2.7,<3",
  "structlog>=24,<26",
  "supabase>=2.13,<3",
  "veil-dp-core",
  "veil-query-ir",
  # Reference implementations for services/analytics-worker/app/benchmark.py's
  # third-party calibration comparison. Not used anywhere on the query path.
  "diffprivlib>=0.6,<1",
  "opendp>=0.15,<1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project.scripts]
veil-benchmark = "app.benchmark:main"

[tool.pytest.ini_options]
pythonpath = ["."]
markers = ["live: requires configured live Supabase credentials"]

# Declared as an extra rather than a PEP 735 dependency group so that a single
# idiom -- pip install -e ".[dev]" -- installs test dependencies for every
# package in this repository.
[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "hypothesis>=6.100,<7",
  "httpx>=0.27,<1",
]
